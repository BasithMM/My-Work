<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zentrix Design</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="./image/logo_for_copy_n-removebg-preview.png" type="image/x-icon">

</head>
<body>
     <header>
        <div class="logo">
            <i><img src="./image/logo_for_copy_n-removebg-preview.png" alt="logo" onerror="this.src='https://placehold.co/40x40?text=Z'"></i>
            <span>Zentrix Design</span>
        </div>
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search designs, posters, mockups...">
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active" id="navHome">Home</a></li>
                <li><a href="#" id="navExplore">Explore</a></li>
                <li><a href="#" id="navCreate">Create</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <button class="theme-toggle" id="themeToggleBtn" aria-label="Dark/Light mode"><i class="fas fa-moon"></i></button>
            <button class="download-all-btn" id="downloadAllBtn"><i class="fas fa-download"></i><span>Save All</span></button>
            <i class="fas fa-bell"></i>
            <i class="fas fa-comment-dots"></i>
            <div class="user-avatar">
                <img src="./image/profile.jpg" alt="User" onerror="this.src='https://randomuser.me/api/portraits/men/32.jpg'">
            </div>
        </div>
    </header>

    <main>
        <div class="pins-container" id="pinsContainer">
            <!-- dynamic pins injected -->
        </div>
    </main>
    <div id="toastMessage" class="toast-msg"></div>

    <script src="script.js"></script>
</body>
</html>
